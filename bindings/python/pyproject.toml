[project]
name = "daylight"
version = "0.1.0"
description = "Both tools of the daylight GPU core, daylight / solar and views, from Python: in-process (daylight_c.dll) or through the CLIs; USD stages in, results out as primvars"
requires-python = ">=3.10"
dependencies = ["usd-core==26.8", "numpy"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
